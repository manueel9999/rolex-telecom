<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolex Telecom — Аудио Мост</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .bridge-container {
      max-width: 500px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(20px);
    }

    .bridge-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .bridge-header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #d4a853;
      margin-bottom: 8px;
    }

    .bridge-header p {
      font-size: 13px;
      color: #8888a0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      margin: 16px auto;
    }

    .status-badge.offline { background: rgba(239,68,68,0.15); color: #ef4444; }
    .status-badge.connecting { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .status-badge.connected { background: rgba(34,197,94,0.15); color: #22c55e; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .connected .status-dot { box-shadow: 0 0 8px currentColor; }

    .device-select {
      margin: 20px 0;
    }

    .device-select label {
      display: block;
      font-size: 12px;
      color: #8888a0;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .device-select select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #f0f0f5;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .device-select select:focus {
      border-color: #d4a853;
    }

    .device-select select option {
      background: #1a1a2e;
      color: #f0f0f5;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .btn-start {
      background: #22c55e;
      color: white;
      box-shadow: 0 0 30px rgba(34,197,94,0.2);
    }
    .btn-start:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(34,197,94,0.3); }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-stop {
      background: #ef4444;
      color: white;
      box-shadow: 0 0 30px rgba(239,68,68,0.2);
    }
    .btn-stop:hover { transform: scale(1.02); }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 13px;
    }

    .info-row .label { color: #8888a0; }
    .info-row .value { color: #f0f0f5; font-weight: 500; }

    .vdo-frame-wrapper {
      margin: 20px 0;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
      min-height: 80px;
    }

    .vdo-frame-wrapper iframe {
      width: 100%;
      height: 80px;
      border: none;
    }

    .log {
      margin-top: 20px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 11px;
      color: #55556a;
      font-family: 'SF Mono', monospace;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
    }

    .log-entry { padding: 2px 0; }
    .log-entry.success { color: #22c55e; }
    .log-entry.error { color: #ef4444; }
    .log-entry.info { color: #d4a853; }

    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
    .pulse { animation: pulse 1.5s infinite; }
  </style>
</head>
<body>
  <div class="bridge-container">
    <div class="bridge-header">
      <h1>🔊 Аудио Мост</h1>
      <p>Rolex Telecom — Windows Bridge via VDO.ninja</p>
    </div>

    <div style="text-align:center">
      <div class="status-badge offline" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Отключен</span>
      </div>
    </div>

    <div class="device-select">
      <label>📱 Код устройства</label>
      <select id="device-select"></select>
    </div>

    <button class="btn btn-start" id="btn-start" onclick="startBridge()">
      ▶ Запустить Мост
    </button>
    <button class="btn btn-stop" id="btn-stop" onclick="stopBridge()" style="display:none">
      ⏹ Остановить
    </button>

    <div class="vdo-frame-wrapper" id="vdo-frame-wrapper" style="display:none">
      <!-- VDO.ninja iframe injected here -->
    </div>

    <div id="info-section" style="display:none">
      <div class="info-row">
        <span class="label">Комната</span>
        <span class="value" id="info-room">—</span>
      </div>
      <div class="info-row">
        <span class="label">Устройство</span>
        <span class="value" id="info-device">—</span>
      </div>
      <div class="info-row">
        <span class="label">Статус</span>
        <span class="value" id="info-status">Подключение...</span>
      </div>
    </div>

    <div class="log" id="log"></div>
  </div>

  <script>
    let vdoIframe = null;

    // --- Log helper ---
    function log(text, type = '') {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.innerHTML += `<div class="log-entry ${type}">[${time}] ${text}</div>`;
      el.scrollTop = el.scrollHeight;
      while (el.children.length > 100) {
        el.removeChild(el.firstChild);
      }
    }

    // --- Set status UI ---
    function setStatus(state, text) {
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      badge.className = `status-badge ${state}`;
      statusText.textContent = text;
    }

    // --- Load device codes ---
    async function loadDeviceCodes() {
      // Check URL params for pre-selected device
      const urlParams = new URLSearchParams(window.location.search);
      const preselectedDevice = urlParams.get('device');

      try {
        const resp = await fetch('/api/admin/devices');
        const data = await resp.json();
        const select = document.getElementById('device-select');
        select.innerHTML = '';
        const deviceList = data.devices || [];
        deviceList.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = `${d.name} (${d.id})`;
          if (preselectedDevice && d.id === preselectedDevice) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });

        // Auto-start if device is preselected
        if (preselectedDevice && deviceList.some(d => d.id === preselectedDevice)) {
          log('Автозапуск для устройства: ' + preselectedDevice, 'info');
          setTimeout(() => startBridge(), 500);
        }
      } catch (e) {
        const select = document.getElementById('device-select');
        select.innerHTML = '<option value="57NvLjFgq4">Устройство №1 (57NvLjFgq4)</option>';
      }
    }

    // --- Start bridge ---
    async function startBridge() {
      const deviceId = document.getElementById('device-select').value;

      if (!deviceId) {
        log('Выберите устройство', 'error');
        return;
      }

      log('Получаю данные комнаты...', 'info');
      setStatus('connecting', 'Подключение...');

      // Fetch VDO room info from server
      try {
        const resp = await fetch(`/api/bridge/${deviceId}`);
        if (!resp.ok) {
          throw new Error('Устройство не найдено');
        }
        const data = await resp.json();
        const { vdoRoom, vdoPassword, deviceName } = data;

        if (!vdoRoom || !vdoPassword) {
          throw new Error('VDO.ninja комната не настроена');
        }

        log(`Комната: ${vdoRoom}`, 'success');
        log(`Устройство: ${deviceName}`, 'info');

        // Build VDO.ninja URL for bridge:
        // - &room= join the device's room
        // - &push push the phone's audio
        // - &miconly audio only
        // - &proaudio high quality
        // - &cleanoutput minimal UI
        // - &autostart auto-connect
        const vdoUrl = `https://vdo.ninja/?room=${encodeURIComponent(vdoRoom)}&password=${encodeURIComponent(vdoPassword)}&push&miconly&proaudio&cleanoutput&autostart&label=Bridge-${deviceId}`;

        // Create iframe
        const wrapper = document.getElementById('vdo-frame-wrapper');
        wrapper.style.display = 'block';
        wrapper.innerHTML = '';

        vdoIframe = document.createElement('iframe');
        vdoIframe.src = vdoUrl;
        vdoIframe.allow = 'camera;microphone;autoplay;display-capture';
        wrapper.appendChild(vdoIframe);

        // Update UI
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-stop').style.display = 'block';
        document.getElementById('info-section').style.display = 'block';

        document.getElementById('info-room').textContent = vdoRoom;
        document.getElementById('info-device').textContent = deviceName;
        document.getElementById('info-status').textContent = 'Подключён к VDO.ninja';

        setStatus('connected', 'Подключён ✅');
        log('VDO.ninja мост запущен! 🎉', 'success');

        // Listen for VDO.ninja events
        window.addEventListener('message', handleVdoMessage);

      } catch (e) {
        log('Ошибка: ' + e.message, 'error');
        setStatus('offline', 'Ошибка');
      }
    }

    // --- Handle VDO.ninja events ---
    function handleVdoMessage(event) {
      if (vdoIframe && event.source === vdoIframe.contentWindow) {
        const data = event.data;
        if (data && data.action) {
          console.log('[VDO Bridge] Event:', data.action);
          if (data.action === 'joined-room') {
            log('Подключён к комнате', 'success');
            document.getElementById('info-status').textContent = 'В комнате';
          } else if (data.action === 'push-connection') {
            log('Аудио поток активен', 'success');
          }
        }
      }
    }

    // --- Stop bridge ---
    function stopBridge() {
      window.removeEventListener('message', handleVdoMessage);

      const wrapper = document.getElementById('vdo-frame-wrapper');
      if (wrapper) {
        wrapper.innerHTML = '';
        wrapper.style.display = 'none';
      }
      vdoIframe = null;

      setStatus('offline', 'Отключен');
      document.getElementById('btn-start').style.display = 'block';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('info-section').style.display = 'none';
      log('Мост остановлен', 'info');
    }

    // --- Init ---
    loadDeviceCodes();
    log('Аудио Мост готов', 'info');
  </script>
</body>
</html>
