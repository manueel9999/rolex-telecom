<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolex Telecom — Аудио Мост</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .bridge-container {
      max-width: 500px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(20px);
    }

    .bridge-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .bridge-header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #d4a853;
      margin-bottom: 8px;
    }

    .bridge-header p {
      font-size: 13px;
      color: #8888a0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      margin: 16px auto;
    }

    .status-badge.offline { background: rgba(239,68,68,0.15); color: #ef4444; }
    .status-badge.connecting { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .status-badge.connected { background: rgba(34,197,94,0.15); color: #22c55e; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .connected .status-dot { box-shadow: 0 0 8px currentColor; }

    .device-select {
      margin: 20px 0;
    }

    .device-select label {
      display: block;
      font-size: 12px;
      color: #8888a0;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .device-select select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #f0f0f5;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .device-select select:focus {
      border-color: #d4a853;
    }

    .device-select select option {
      background: #1a1a2e;
      color: #f0f0f5;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .btn-start {
      background: #22c55e;
      color: white;
      box-shadow: 0 0 30px rgba(34,197,94,0.2);
    }
    .btn-start:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(34,197,94,0.3); }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-stop {
      background: #ef4444;
      color: white;
      box-shadow: 0 0 30px rgba(239,68,68,0.2);
    }
    .btn-stop:hover { transform: scale(1.02); }

    .audio-meter {
      margin: 20px 0;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .audio-meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #d4a853);
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 13px;
    }

    .info-row .label { color: #8888a0; }
    .info-row .value { color: #f0f0f5; font-weight: 500; }

    .log {
      margin-top: 20px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 11px;
      color: #55556a;
      font-family: 'SF Mono', monospace;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
    }

    .log-entry { padding: 2px 0; }
    .log-entry.success { color: #22c55e; }
    .log-entry.error { color: #ef4444; }
    .log-entry.info { color: #d4a853; }

    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
    .pulse { animation: pulse 1.5s infinite; }
  </style>
</head>
<body>
  <div class="bridge-container">
    <div class="bridge-header">
      <h1>🔊 Аудио Мост</h1>
      <p>Rolex Telecom — Windows Bridge</p>
    </div>

    <div style="text-align:center">
      <div class="status-badge offline" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Отключен</span>
      </div>
    </div>

    <div class="device-select">
      <label>🎤 Микрофон (захват звука звонка)</label>
      <select id="mic-select"><option>Загрузка...</option></select>
    </div>

    <div class="device-select">
      <label>🔊 Динамик (куда выводить голос оператора)</label>
      <select id="speaker-select"><option>Загрузка...</option></select>
    </div>

    <div class="device-select">
      <label>📱 Код устройства</label>
      <select id="device-select"></select>
    </div>

    <button class="btn btn-start" id="btn-start" onclick="startBridge()">
      ▶ Запустить Мост
    </button>
    <button class="btn btn-stop" id="btn-stop" onclick="stopBridge()" style="display:none">
      ⏹ Остановить
    </button>

    <div class="audio-meter" id="audio-meter" style="display:none">
      <div class="audio-meter-fill" id="audio-meter-fill"></div>
    </div>

    <div id="info-section" style="display:none">
      <div class="info-row">
        <span class="label">Подключение</span>
        <span class="value" id="info-connection">—</span>
      </div>
      <div class="info-row">
        <span class="label">Микрофон</span>
        <span class="value" id="info-mic">—</span>
      </div>
      <div class="info-row">
        <span class="label">Динамик</span>
        <span class="value" id="info-speaker">—</span>
      </div>
    </div>

    <div class="log" id="log"></div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script>
    let ws = null;
    let pc = null;
    let localStream = null;
    let analyser = null;
    let animFrame = null;

    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ];

    // --- Log helper ---
    function log(text, type = '') {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.innerHTML += `<div class="log-entry ${type}">[${time}] ${text}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    // --- Load audio devices ---
    async function loadDevices() {
      try {
        // Need permission first
        const temp = await navigator.mediaDevices.getUserMedia({ audio: true });
        temp.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();

        const micSelect = document.getElementById('mic-select');
        const speakerSelect = document.getElementById('speaker-select');

        micSelect.innerHTML = '';
        speakerSelect.innerHTML = '';

        devices.filter(d => d.kind === 'audioinput').forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.textContent = d.label || `Микрофон ${i + 1}`;
          micSelect.appendChild(opt);
        });

        devices.filter(d => d.kind === 'audiooutput').forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.textContent = d.label || `Динамик ${i + 1}`;
          speakerSelect.appendChild(opt);
        });

        log('Устройства загружены', 'success');
      } catch (e) {
        log('Ошибка доступа к микрофону: ' + e.message, 'error');
      }
    }

    // --- Load device codes ---
    async function loadDeviceCodes() {
      try {
        const resp = await fetch('/api/admin/devices');
        const data = await resp.json();
        const select = document.getElementById('device-select');
        select.innerHTML = '';
        data.devices.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = `${d.name} (${d.id})`;
          select.appendChild(opt);
        });
      } catch (e) {
        // Fallback — manual input
        const select = document.getElementById('device-select');
        select.innerHTML = '<option value="57NvLjFgq4">Устройство №1 (57NvLjFgq4)</option>';
      }
    }

    // --- Set status UI ---
    function setStatus(state, text) {
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      badge.className = `status-badge ${state}`;
      statusText.textContent = text;
    }

    // --- Start bridge ---
    async function startBridge() {
      const deviceId = document.getElementById('device-select').value;
      const micId = document.getElementById('mic-select').value;
      const speakerId = document.getElementById('speaker-select').value;

      if (!deviceId) {
        log('Выберите устройство', 'error');
        return;
      }

      log('Подключение...', 'info');
      setStatus('connecting', 'Подключение...');

      // Get mic
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { deviceId: { exact: micId } },
          video: false,
        });
        log('Микрофон захвачен', 'success');

        // Set up audio meter
        const audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(localStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        startMeter();

      } catch (e) {
        log('Ошибка микрофона: ' + e.message, 'error');
        setStatus('offline', 'Ошибка');
        return;
      }

      connectWS(deviceId, speakerId);

      // Update UI
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'block';
      document.getElementById('audio-meter').style.display = 'block';
      document.getElementById('info-section').style.display = 'block';

      document.getElementById('info-mic').textContent =
        document.getElementById('mic-select').selectedOptions[0]?.textContent || '—';
      document.getElementById('info-speaker').textContent =
        document.getElementById('speaker-select').selectedOptions[0]?.textContent || '—';
    }

    // --- WebSocket connection (with reconnect) ---
    function connectWS(deviceId, speakerId) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws?type=bridge&id=${deviceId}`);

      ws.onopen = () => {
        log('WebSocket подключен', 'success');
        setStatus('connecting', 'Ожидание оператора...');
        ws.send(JSON.stringify({ type: 'rtc_ready', role: 'bridge', deviceId }));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'rtc_offer') {
          log('Получен offer от оператора', 'info');
          await handleOffer(msg, speakerId);
        } else if (msg.type === 'rtc_ice') {
          if (pc && msg.candidate && msg.role !== 'bridge') {
            try {
              await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
            } catch (e) {
              log('ICE ошибка: ' + e.message, 'error');
            }
          }
        } else if (msg.type === 'rtc_ready' && msg.role === 'operator') {
          log('Оператор готов!', 'success');
        }
      };

      ws.onclose = () => {
        // If WebRTC is already connected, audio flows P2P — no need to reconnect WS
        if (pc && pc.connectionState === 'connected') {
          log('WebSocket отключен, но аудио работает через P2P ✅', 'info');
          return;
        }
        log('WebSocket отключен — переподключение через 3с...', 'error');
        setStatus('connecting', 'Переподключение...');
        setTimeout(() => {
          if (localStream) {
            connectWS(deviceId, speakerId);
          }
        }, 3000);
      };

      ws.onerror = (e) => {
        log('WebSocket ошибка', 'error');
      };
    }

    // --- Handle WebRTC offer ---
    async function handleOffer(msg, speakerId) {
      if (pc) pc.close();

      pc = new RTCPeerConnection({ iceServers });

      // Add local tracks (mic)
      if (localStream) {
        localStream.getTracks().forEach(track => {
          pc.addTrack(track, localStream);
        });
      }

      // Handle remote tracks (operator's voice)
      pc.ontrack = (event) => {
        log('Получен аудио-поток оператора! 🎉', 'success');
        const remoteAudio = document.getElementById('remote-audio');
        remoteAudio.srcObject = event.streams[0];

        // Set output device (e.g. Galaxy A07 Bluetooth)
        if (speakerId && typeof remoteAudio.setSinkId === 'function') {
          remoteAudio.setSinkId(speakerId).then(() => {
            log('Динамик установлен: ' + speakerId, 'success');
          }).catch(e => {
            log('setSinkId ошибка: ' + e.message, 'error');
          });
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'rtc_ice',
            candidate: event.candidate,
            role: 'bridge',
          }));
        }
      };

      pc.onconnectionstatechange = () => {
        const state = pc.connectionState;
        log('Соединение: ' + state, state === 'connected' ? 'success' : 'info');

        if (state === 'connected') {
          setStatus('connected', 'Подключен ✅');
          document.getElementById('info-connection').textContent = 'WebRTC P2P';
        } else if (state === 'failed' || state === 'disconnected') {
          setStatus('offline', 'Разъединён');
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      ws.send(JSON.stringify({
        type: 'rtc_answer',
        sdp: answer,
        role: 'bridge',
      }));

      log('Отправлен answer', 'info');
    }

    // --- Stop bridge ---
    function stopBridge() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (pc) { pc.close(); pc = null; }
      if (ws) { ws.close(); ws = null; }
      if (animFrame) cancelAnimationFrame(animFrame);

      setStatus('offline', 'Отключен');
      document.getElementById('btn-start').style.display = 'block';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('audio-meter').style.display = 'none';
      document.getElementById('info-section').style.display = 'none';
      log('Мост остановлен', 'info');
    }

    // --- Audio meter ---
    function startMeter() {
      const fill = document.getElementById('audio-meter-fill');
      const data = new Uint8Array(analyser.frequencyBinCount);

      function update() {
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        const avg = sum / data.length;
        const pct = Math.min(100, (avg / 128) * 100);
        fill.style.width = pct + '%';
        animFrame = requestAnimationFrame(update);
      }
      update();
    }

    // --- Init ---
    loadDevices();
    loadDeviceCodes();
    log('Аудио Мост готов', 'info');
  </script>
</body>
</html>
